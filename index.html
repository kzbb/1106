<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="台本ノート">
<meta name="theme-color" content="#1c1c1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>台本ノート</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bar">
  <!-- メニューと、開いているPDFの切り替え -->
  <div class="grp">
    <button id="bMenu" title="PDFを開く・閉じる・書き出し、表示の設定、指で描く、作業データの読み込み">メニュー</button>
    <select id="sDoc" title="開いているPDFの切り替え" hidden></select>
    <button id="bFit" title="ズームを戻す">全体</button>
  </div>
  <!-- 書く道具（選択中のものをもう一度押すと、何も選んでいない状態になる） -->
  <div class="grp">
    <button data-tool="pen">ペン</button>
    <button data-tool="marker">マーカー</button>
    <button data-tool="eraser" title="なぞった部分だけ消す。大きさは細・中・太で選ぶ">消しゴム</button>
  </div>
  <div class="grp">
    <button class="shp" data-tool="shape" data-shape="line" title="直線（始点から終点までドラッグ）" aria-label="直線">／</button>
    <button class="shp" data-tool="shape" data-shape="ellipse" title="円・楕円" aria-label="円・楕円" data-icon="○●">○</button>
    <button class="shp" data-tool="shape" data-shape="tri" title="三角形" aria-label="三角形" data-icon="△▲">△</button>
    <button class="shp" data-tool="shape" data-shape="rect" title="四角形" aria-label="四角形" data-icon="□■">□</button>
    <button class="shp" data-tool="shape" data-shape="star" title="星" aria-label="星" data-icon="☆★">☆</button>
    <select id="sFillA" title="これから描く図形の塗り。数字は濃さ（小さいほど透けて下の文字が見える）">
      <option value="0">塗りなし</option>
      <option value="0.25">塗り 25%</option>
      <option value="0.5">塗り 50%</option>
      <option value="0.75">塗り 75%</option>
      <option value="1">塗り 100%</option>
    </select>
    <select id="sArrow" title="これから描く直線の矢印（片矢印は描き終わりの側に付く）" hidden>
      <option value="0">矢印なし</option>
      <option value="1">片矢印</option>
      <option value="2">両矢印</option>
    </select>
  </div>
  <div class="grp">
    <button class="col" data-color="#111111" style="--c:#111111" aria-label="黒"></button>
    <button class="col" data-color="#d00000" style="--c:#d00000" aria-label="赤"></button>
    <button class="col" data-color="#0050d0" style="--c:#0050d0" aria-label="青"></button>
    <button class="col" data-color="#008a3c" style="--c:#008a3c" aria-label="緑"></button>
    <button class="col" data-color="#f5c400" style="--c:#f5c400" aria-label="黄"></button>
    <button class="col light" data-color="#ffffff" style="--c:#ffffff" aria-label="白"></button>
  </div>
  <div class="grp">
    <button data-width="s" title="線の太さ・消しゴムの大きさ">細</button>
    <button data-width="m" title="線の太さ・消しゴムの大きさ">中</button>
    <button data-width="l" title="線の太さ・消しゴムの大きさ">太</button>
  </div>
  <!-- 画像と、置いたものの選択 -->
  <div class="grp">
    <button data-tool="select" data-smode="rect" title="書き込みを選ぶ。触れたものを選ぶか、何もないところから長方形で囲む">選択</button>
    <button data-tool="select" data-smode="lasso" title="書き込みを選ぶ。触れたものを選ぶか、何もないところから自由な形で囲む">投げ縄</button>
    <button id="bImage">画像</button>
    <button id="bPaste" title="最後にコピーしたものを貼る。ほかのアプリでコピーした画像も、このアプリで「コピー」した書き込み（ほかのページ・ほかのPDFにも貼れる）も貼れる">貼り付け</button>
  </div>
  <div class="grp">
    <button id="bUndo">取り消す</button>
    <button id="bRedo">やり直す</button>
  </div>
  <!-- ページ送り -->
  <div class="grp nav">
    <button id="bLeft">◀</button>
    <button id="bPage" title="ページ番号を指定して移動">-</button>
    <button id="bRight">▶</button>
    <button id="bUpdate" hidden title="新しい版に切り替えます（作業内容は保持されます）">更新</button>
  </div>
  <!-- メニューの中身。PDFの操作と、たまにしか使わない設定 -->
  <div id="menu" hidden>
    <div class="mrow"><span>PDF</span>
      <button id="bOpen" class="mclose" title="PDFを追加して開く（開いているPDFはそのまま残ります）">開く</button>
      <button id="bClose" class="mclose" title="表示中のPDFを閉じる（書き込みも削除されます）">閉じる</button>
      <button id="bExport" class="mclose" title="表示中のPDFを書き出す">書き出し</button>
    </div>
    <div class="mrow"><span>表示</span>
      <button id="bMode" title="1ページ表示と見開き表示の切り替え"></button>
      <button id="bDir" title="ページ送りの方向"></button>
      <button id="bCover" title="見開きで1ページ目を単独にする">表紙単独</button>
    </div>
    <div class="mrow"><span>枠外</span>
      <button id="bMargin" title="枠外領域の表示">表示する</button>
      <select id="sMargin" title="枠外領域の高さ">
        <option value="0.1">小</option>
        <option value="0.2">中</option>
        <option value="0.35">大</option>
      </select>
    </div>
    <div class="mrow"><span>入力</span>
      <button id="bFinger" title="オン: Pencilで描き、指は移動とページ送り。オフ: 指で描く（Apple Pencil がないとき）">Pencilを使う</button>
    </div>
    <div class="mrow"><span>データ</span>
      <button id="bImport" title="「書き出し」で保存した作業データを、新しいPDFとして読み込む">作業データを読み込む</button>
    </div>
    <div class="mrow"><span>状態</span>
      <button id="bState" class="mclose" title="作業内容の保存と、オフラインで使えるかを表示する">保存とオフライン</button>
    </div>
  </div>
</div>

<div id="stage">
  <div id="world"></div>
  <canvas id="overlay"></canvas>
  <!-- 状態の通知。保存したときや異常があるときだけ右上に出る。押すと状態の一覧を開く -->
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="stPanel" hidden>
    <!-- 直前の操作で起きた問題と、その解決策（写真を読み込めなかったときなど） -->
    <div id="stNote" hidden>
      <b id="stNoteT" class="warn"></b>
      <p id="stNoteB"></p>
      <ol id="stNoteL"></ol>
    </div>
    <div class="strow"><span>作業内容</span><b id="stSave"></b></div>
    <p id="stSaveMsg" hidden></p>
    <div class="strow"><span>オフライン</span><b id="stOff"></b></div>
    <p id="stOffMsg" hidden></p>
    <button id="bStClose">閉じる</button>
  </div>
  <!-- 書き込みを選んでいる間だけ出る操作。選んだものの種類に応じて、使える項目だけを出す -->
  <div id="selBar" hidden>
    <span id="selInfo"></span>
    <div class="sg" id="sgColor" title="選択したものの色">
      <button class="col" data-scolor="#111111" style="--c:#111111" aria-label="黒"></button>
      <button class="col" data-scolor="#d00000" style="--c:#d00000" aria-label="赤"></button>
      <button class="col" data-scolor="#0050d0" style="--c:#0050d0" aria-label="青"></button>
      <button class="col" data-scolor="#008a3c" style="--c:#008a3c" aria-label="緑"></button>
      <button class="col" data-scolor="#f5c400" style="--c:#f5c400" aria-label="黄"></button>
      <button class="col light" data-scolor="#ffffff" style="--c:#ffffff" aria-label="白"></button>
    </div>
    <div class="sg" id="sgWidth" title="選択した線の太さ">
      <button data-swidth="s">細</button>
      <button data-swidth="m">中</button>
      <button data-swidth="l">太</button>
    </div>
    <select id="sSelAlpha" title="選択した線の不透明度（小さいほど透ける）">
      <option value="" disabled>不透明度 —</option>
      <option value="1">不透明度 100%</option>
      <option value="0.75">不透明度 75%</option>
      <option value="0.5">不透明度 50%</option>
      <option value="0.35">不透明度 35%</option>
      <option value="0.25">不透明度 25%</option>
    </select>
    <select id="sSelFill" title="選択した図形の塗り。数字は濃さ">
      <option value="" disabled>塗り —</option>
      <option value="0">塗りなし</option>
      <option value="0.25">塗り 25%</option>
      <option value="0.5">塗り 50%</option>
      <option value="0.75">塗り 75%</option>
      <option value="1">塗り 100%</option>
    </select>
    <select id="sSelArrow" title="選択した直線の矢印">
      <option value="" disabled>矢印 —</option>
      <option value="0">矢印なし</option>
      <option value="1">終点に矢印</option>
      <option value="3">始点に矢印</option>
      <option value="2">両矢印</option>
    </select>
    <div class="sg">
      <button id="bAddSel" title="オンの間は、押したものや囲んだものを選択に足す（選択済みのものを押すと外す）。オンの間は枠の内側を押しても動かさない">追加選択</button>
      <button id="bGroup" title="選択したものを1つのまとまりにする">グループ化</button>
      <button id="bUngroup" title="グループを元の個別の書き込みに戻す">グループ解除</button>
      <button id="bCopy" title="選択したものをコピーする。「貼り付け」で、ほかのページやPDFにも貼れる">コピー</button>
      <button id="bFront" title="選択したものを、ほかの書き込みより手前に出す">最前面へ</button>
      <button id="bBack" title="選択したものを、ほかの書き込みより奥へ送る（PDFより奥にはなりません）">最背面へ</button>
      <button id="bDelete">削除</button>
    </div>
  </div>
  <div id="empty">
    <p>台本のPDFを開いてください</p>
    <button id="bOpen2">PDFを開く</button>
  </div>
</div>

<div id="busy" hidden><span>読み込み中…</span></div>

<input type="file" id="fPdf" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fData" hidden>

<dialog id="dlg">
  <div id="expChoose">
    <p id="expMsg">PDFを書き出します</p>
    <button id="bExpWith">枠外領域を含めて書き出す</button>
    <button id="bExpWithout">枠外領域を含めずに書き出す</button>
    <button id="bExpData" title="PDF・書き込み・画像をまとめた控え。メニューの「作業データを読み込む」で続きを編集できる">作業データを書き出す（控え・引き継ぎ用）</button>
  </div>
  <div id="expReady" hidden>
    <p>ファイルができました。「ファイルに保存」などを選んでください</p>
    <button id="bExpShare">保存・共有</button>
  </div>
  <button id="bExpCancel" class="sub">キャンセル</button>
</dialog>

<script src="vendor/pdfjs/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/clipper.js"></script>
<script src="app.js"></script>
</body>
</html>
